<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinycius Assis - Portifolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-layout-container">
    <aside class="left-sidebar">
        <img src="ilustracao-perfil.jpeg" width="272px" height="272px" alt="foto-perfil" class="profile-pic">
        <p class="apresentacao">desenvolvedor fullstack python, docker,criativo e colaborativo, adepto da filosofia do open source 
        como meio para acesso e manutencao da liberdade das pessoas, que todo software tem um proposito social <br>por natureza</p>
            <div class="icones-resumo">
                <abbr title="python"><img src="Python.svg" alt="python"></abbr>
                <abbr title="Ubuntu"><img src="Ubuntu.svg" alt="Ubuntu"></abbr>
                <abbr title="scikit-learn"><img src="TensorFlow.svg" alt="TensorFlow"></abbr>
            </div>
            </aside>
        </div>

    <div class="game-container">
        <!-- A caixa de diálogo principal -->
        <div class="dialog-box" id="dialogBox">
            <div class="name">Vinycius Assis Fonseca - Desenvolvedor</div>
            <div class="dialog-content" id="dialogContent">
                <!-- Texto do diálogo será inserido aqui pelo JS -->
            </div>
            <div class="dialog-options" id="dialogOptions">
                <!-- Botões de opção serão inseridos aqui pelo JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
