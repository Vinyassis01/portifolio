<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="nome-projeto"></h1>
        <p id="subtitulo-projeto"></p>
    </header>

    <nav>
        <button onclick="mostrarSecao('status')">Status</button>
        <button onclick="mostrarSecao('tecnologias')">Tecnologias</button>
        <button onclick="mostrarSecao('detalhes')">Detalhes Técnicos</button>
        <button onclick="mostrarSecao('adrs')">ADRs</button>
        <button onclick="mostrarSecao('contribuicoes')">Contribuições</button>
    </nav>

    <main>
        <!-- As seções começam ocultas via CSS -->
        <section id="status" class="conteudo fade-in">
            <div class="card">
            <h2>Status do Projeto</h2>
            <p id="txt-status"></p>
            <p id="descricao" class="subtexto"></p>
            <p id="objetivo"></p>
            <p id="data"></p>
            <p id="github"></p>
            </div>
        </section>

        <section id="tecnologias" class="conteudo fade-in" style="display:none;">
        <h2>Tecnologias Utilizadas</h2>
        <div class="tech-grid">
        <div class="tech-card">
          <h3 id="tech1"></h3>
          <ul>
            <li id="tech1li1"></li>
            <li id="tech1li2"></li>
            <li id="tech1li3"></li>
            <li id="tech1li4"></li>
            <li id="tech1li5"></li>
          </ul>
        </div>
        <div class="tech-card">
          <h3 id="tech2"></h3>
          <ul>
            <li id="tech2li1"></li>
            <li id="tech2li2"></li>
            <li id="tech2li3"></li>
            <li id="tech2li4"></li>
            <li id="tech2li5"></li>
          </ul>
        </div>
        <div class="tech-card">
          <h3 id="tech3"></h3>
          <ul>
            <li id="tech3li1"></li>
            <li id="tech3li2"></li>
            <li id="tech3li3"></li>
            <li id="tech3li4"></li>
            <li id="tech3li5"></li>
          </ul>
        </div>
        <div class="tech-card">
          <h3 id="tech4"></h3>
          <ul>
            <li id="tech4li1"></li>
            <li id="tech4li2"></li>
            <li id="tech4li3"></li>
            <li id="tech4li4"></li>
            <li id="tech4li5"></li>
          </ul>
        </div>

        </div>
        </section>

        <section id="detalhes" class="conteudo fade-in" style="display:none;">
            <div class="card">
            <h2>Detalhes Técnicos</h2>
            <p id="txt-detalhes"></p>
            <div class="card-detalhes">
            <h3 id="title1"></h3>
            <p id="detalhes1"></p>
            </div>
            <div class="card-detalhes">
            <h3 id="title2"></h3>
            <p id="detalhes2"></p>
            </div>
            <div class="card-detalhes">
            <h3 id="title3"></h3>
            <p id="detalhes3"></p>
            </div>
            <div class="card-detalhes">
            <h3 id="title4"></h3>
            <p id="detalhes4"></p>
            </div>
            </div>
        </section>

        <section id="adrs" class="conteudo fade-in" style="display:none;">
            <div class="card">
            <h2>ADR's</h2>
            <p id="adrs_detalhes"></p>
            <div class="card-adrs">
                <h3 id="adrs_title1"></h3>
                <p id="adrs1"></p>
            </div>
            <div class="card-adrs">
                <h3 id="adrs_title2"></h3>
                <p id="adrs2"></p>
            </div>
            <div class="card-adrs">
                <h3 id="adrs_title3"></h3>
                <p id="adrs3"></p>
            </div>
            <div class="card-adrs">
                <h3 id="adrs_title4"></h3>
                <p id="adrs4"></p>
            </div>
            </div>
        </section>

        <section id="contribuicoes" class="conteudo fade-in" style="display:none;">
            <div class="card">
                <h2>Contribuições</h2>
                <p id="txt_contribuicoes"></p>
                <div class="card-contrib">
                <h3 id="contrib_title1"></h3>
                <p id="contrib1"></p>
                </div>
                <div class="card-contrib">
                <h3 id="contrib_title2"></h3>
                <p id="contrib2"></p>
                </div>
                <div class="card-contrib">
                <h3 id="contrib_title3"></h3>
                <p id="contrib3"></p>
                </div>
                <div class="card-contrib">
                <h3 id="contrib_title4"></h3>
                <p id="contrib4"></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="card">
        <p>Minhas redes:</p>
        <a href="#">LinkedIn</a> | <a href="#">GitHub</a>
        </div>
    </footer>

    <script src="db-projetos.js"></script>
    <script src="script.js"></script>
</body>
</html>
